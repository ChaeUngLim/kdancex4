<title>K-DanceX4 프로토타입</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 역할 전환 바 + 좌측 화면 목록 + 중앙 무대(회원은 폰 프레임, 강사·대표는 사이드바 웹 앱) */
:root{
  --bg:#f6f5f4; --panel:#ffffff; --panel-2:#f1efed; --line:#e6e2de; --line-2:#d6d0ca;
  --fg:#17161a; --fg-2:#5d5862; --fg-3:#928b95;
  --accent:#d8452f; --accent-fg:#ffffff; --accent-soft:#fbe6e1;
  --ok:#1f7a4d; --ok-soft:#e2f3e9; --warn:#a8650c; --warn-soft:#fbefd9; --info:#3552b8; --info-soft:#e6eafb;
  --ink:#17161a; --ink-fg:#f7f5f3;
  --shadow:0 1px 2px rgba(23,22,26,.06),0 8px 24px -12px rgba(23,22,26,.18);
  --phone:#0f0e11;
  --display:"Geist","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR","Geist",system-ui,sans-serif; --mono:"Geist",ui-monospace,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121114; --panel:#1b1a1e; --panel-2:#232226; --line:#2c2a30; --line-2:#3a373f;
  --fg:#f1eeeb; --fg-2:#aaa4ad; --fg-3:#736d78;
  --accent:#ff6a52; --accent-fg:#1a0d0a; --accent-soft:#3a1f1a;
  --ok:#5fcf8f; --ok-soft:#173327; --warn:#f0b35a; --warn-soft:#3a2a12; --info:#8ea3ff; --info-soft:#1d2447;
  --ink:#f1eeeb; --ink-fg:#121114; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --phone:#000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121114; --panel:#1b1a1e; --panel-2:#232226; --line:#2c2a30; --line-2:#3a373f;
  --fg:#f1eeeb; --fg-2:#aaa4ad; --fg-3:#736d78;
  --accent:#ff6a52; --accent-fg:#1a0d0a; --accent-soft:#3a1f1a;
  --ok:#5fcf8f; --ok-soft:#173327; --warn:#f0b35a; --warn-soft:#3a2a12; --info:#8ea3ff; --info-soft:#1d2447;
  --ink:#f1eeeb; --ink-fg:#121114; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); --phone:#000; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;font-family:var(--display);letter-spacing:-.01em;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.dim{color:var(--fg-2)} .faint{color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.01em;background:var(--panel-2);color:var(--fg-2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ink{background:var(--ink);color:var(--ink-fg);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- 상단 바 ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;font-weight:800}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);gap:2px}
.seg button{padding:6px 14px;border-radius:9px;font-weight:600;color:var(--fg-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.topbar .sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--fg-2)}
.iconbtn svg{width:16px;height:16px}
.kbd{font:600 11px var(--mono);padding:2px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;color:var(--fg-2);background:var(--panel)}

/* ---------- 무대 ---------- */
.stage{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;min-height:calc(100% - 55px)}
.rail{border-right:1px solid var(--line);padding:18px 14px;background:var(--panel);position:sticky;top:55px;height:calc(100vh - 55px);overflow:auto}
.rail h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin:12px 8px 8px;font-weight:600}
.rail button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;color:var(--fg-2);font-weight:500;text-align:left}
.rail button .n{font:600 10.5px var(--mono);color:var(--fg-3);min-width:22px}
.rail button[aria-current="true"]{background:var(--panel-2);color:var(--fg)}
.rail button[aria-current="true"] .n{color:var(--accent)}
.rail .meta{margin:18px 8px 0;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg-3);line-height:1.55}
.canvas{padding:28px 32px 40px;min-width:0}
@media (max-width:900px){.stage{grid-template-columns:1fr}.rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.canvas{padding:18px 16px 32px}}

/* ---------- 폰 프레임 ---------- */
.phone-wrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:900px){.phone-wrap{grid-template-columns:1fr}}
.phone{width:100%;max-width:380px;aspect-ratio:390/844;background:var(--phone);border-radius:48px;padding:12px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06) inset;position:relative;margin:0 auto}
.screen{position:absolute;inset:12px;border-radius:38px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 0;font:600 12.5px var(--mono);color:var(--fg)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:96px;height:26px;border-radius:14px;background:var(--phone);z-index:3}
.app{flex:1;overflow:auto;scrollbar-width:none;padding:12px 18px 90px}
.app::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;padding:10px 12px 22px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--fg-3)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--accent)}
.apphead{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.apphead h2{font-size:20px;font-weight:700;flex:1}
.apphead .back{width:32px;height:32px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center}
.genres{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 4px}
.genres button{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:12.5px;color:var(--fg-2);background:var(--panel)}
.genres button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.search{display:flex;align-items:center;gap:8px;margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--panel-2);color:var(--fg-3);font-size:13px;cursor:pointer}
.ticker{overflow:hidden;border-radius:12px;background:var(--ink);color:var(--ink-fg);padding:9px 0;margin:10px 0 4px;font-size:12px;font-weight:600;white-space:nowrap}
.ticker .track{display:inline-block;animation:tick 22s linear infinite;padding-left:100%}
.ticker:hover .track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none;padding-left:12px}}
.ticker .rank{color:var(--accent);margin:0 6px 0 16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.sec h3{font-size:14.5px;font-weight:700}
.sec .faint{font-size:11.5px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--line-2)}
.cls{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center}
.thumb{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,var(--accent-soft),var(--panel-2));display:grid;place-items:center;font-weight:800;color:var(--accent);font-family:var(--display);font-size:13px}
.thumb.b{background:linear-gradient(135deg,var(--info-soft),var(--panel-2));color:var(--info)}
.thumb.g{background:linear-gradient(135deg,var(--ok-soft),var(--panel-2));color:var(--ok)}
.thumb.y{background:linear-gradient(135deg,var(--warn-soft),var(--panel-2));color:var(--warn)}
.cls .t{font-weight:700;font-size:13.5px;line-height:1.3}
.cls .s{font-size:12px;color:var(--fg-2);margin-top:2px}
.cls .m{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.seats{display:inline-flex;gap:3px;align-items:center}
.seats i{width:6px;height:6px;border-radius:2px;background:var(--line-2);display:inline-block}
.seats i.on{background:var(--ok)}
.hero{border-radius:16px;padding:14px;color:var(--ink-fg);background:var(--ink);margin-bottom:10px}
.hero .l{font-size:11px;opacity:.7;font-weight:600;letter-spacing:.04em}
.hero .b{font-family:var(--display);font-size:22px;font-weight:700;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--fg-2)} .row .v{font-weight:600;text-align:right}
.row .v.ok{color:var(--ok)} .row .v.acc{color:var(--accent)}
.row.total .k,.row.total .v{font-size:15px;font-weight:700;color:var(--fg)}
.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:13px;border-radius:13px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:14px}
.btn.ghost{background:var(--panel-2);color:var(--fg)}
.btn.ink{background:var(--ink);color:var(--ink-fg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:9px 12px;font-size:12.5px;border-radius:10px;width:auto}
.field{margin:8px 0}
.field label{display:block;font-size:11.5px;font-weight:600;color:var(--fg-3);margin-bottom:5px;letter-spacing:.02em}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);font:inherit;color:var(--fg)}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--fg-2)}
.opts button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pay{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-weight:600;font-size:13px;width:100%;text-align:left}
.pay[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.pay .r{margin-left:auto;font-weight:500;color:var(--fg-3);font-size:11.5px}
.note{font-size:11.5px;color:var(--fg-3);line-height:1.5;margin:10px 0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;margin:10px 0}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;margin:10px 0}
.infobox{background:var(--info-soft);color:var(--info);border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;margin:10px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal .d{color:var(--fg-3);font-size:10.5px;font-weight:600}
.cal .n{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;position:relative;font-weight:500}
.cal .n.on{background:var(--ink);color:var(--ink-fg);font-weight:700}
.cal .n.ev::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.agenda{display:grid;grid-template-columns:4px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.agenda .bar{border-radius:2px;background:var(--accent)}
.agenda .t{font-weight:700;font-size:13px} .agenda .s{font-size:12px;color:var(--fg-2)}
.feedcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:10px;background:var(--panel)}
.feedcard.tap{cursor:pointer}
.feedcard .img{height:96px;background:linear-gradient(120deg,var(--accent-soft),var(--info-soft))}
.feedcard .img.b{background:linear-gradient(120deg,var(--info-soft),var(--ok-soft))}
.feedcard .bd{padding:10px 12px}
.feedcard .t{font-weight:700;font-size:13.5px;margin-top:6px} .feedcard .s{font-size:12px;color:var(--fg-2)}
.bubble{max-width:86%;padding:10px 12px;border-radius:16px;font-size:13px;line-height:1.45;margin-bottom:8px;background:var(--panel-2)}
.bubble.me{margin-left:auto;background:var(--ink);color:var(--ink-fg);border-bottom-right-radius:6px}
.bubble.ai{border-bottom-left-radius:6px}
.bubble .tag{display:block;font-size:10.5px;color:var(--fg-3);margin-bottom:4px;font-weight:600}
.reasons{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.reasons span{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--ink-fg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 폰 옆 설명 */
.explain h3{font-size:18px;font-weight:700;margin-bottom:6px}
.explain p{color:var(--fg-2);margin:0 0 12px;max-width:52ch}
.explain .fr{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.explain .fr span{font:500 11px var(--mono);padding:3px 8px;border-radius:6px;background:var(--panel-2);color:var(--fg-2);border:1px solid var(--line)}
.explain .steps{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.explain .steps li{display:flex;gap:10px;font-size:13px;color:var(--fg-2)}
.explain .steps li b{color:var(--fg);font-weight:600}
.explain .steps li .k{font:600 11px var(--mono);color:var(--accent);min-width:18px;padding-top:2px}

/* ---------- 웹 앱(강사·대표) ---------- */
.web{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:640px}
@media (max-width:900px){.web{grid-template-columns:1fr}}
.side{border-right:1px solid var(--line);padding:16px 12px;background:var(--panel-2);display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){.side{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;flex-wrap:wrap}}
.side .who{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.side .av{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:12px}
.side .who b{display:block;font-size:13px} .side .who small{color:var(--fg-3);font-size:11px}
.side button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--fg-2);font-weight:500;font-size:13px;text-align:left}
.side button svg{width:16px;height:16px;flex:none}
.side button[aria-current="true"]{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.side .badge{margin-left:auto;font:600 10.5px var(--mono);padding:1px 6px;border-radius:6px;background:var(--accent);color:var(--accent-fg)}
.main{padding:22px 26px;min-width:0}
.main .head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.main .head h2{font-size:20px;font-weight:700}
.main .head p{margin:2px 0 0;color:var(--fg-2);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--panel)}
.kpi .l{font-size:11.5px;color:var(--fg-3);font-weight:600}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .d{font-size:11.5px;margin-top:3px;color:var(--fg-2)}
.kpi .d.up{color:var(--ok)} .kpi .d.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;flex-wrap:wrap}
.panel .pb{padding:12px 14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.form .full{grid-column:1/-1}
@media (max-width:900px){.form{grid-template-columns:1fr}}
.fld label{display:block;font-size:11.5px;font-weight:600;color:var(--fg-3);margin-bottom:5px}
.fld .input{padding:9px 11px;border-radius:10px;font-size:13px}
.fld .lowc{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.fld .hint{font-size:11px;color:var(--fg-3);margin-top:4px}
.fld .hint.warn{color:var(--warn);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.aibox{border:1px dashed var(--line-2);border-radius:14px;padding:12px 14px;background:var(--panel-2)}
.aibox .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:8px}
.aibox p{margin:0 0 8px;font-size:12.5px;color:var(--fg-2);line-height:1.5}
.aibox .quota{font-size:11px;color:var(--fg-3)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:900px){.steps3{grid-template-columns:1fr}}
.stage3{border:1px solid var(--line);border-radius:14px;padding:12px}
.stage3 .l{font-size:11.5px;font-weight:600;color:var(--fg-3)}
.stage3 .v{font-family:var(--display);font-size:20px;font-weight:700;margin:4px 0}
.stage3 .s{font-size:12px;color:var(--fg-2)}

function cancelRule(cancelDate,eventDate,deadline,paidDate){
  if(cancelDate>deadline) return {label:"환불 마감일 이후",rate:null,blocked:true};
  const days=Math.round((eventDate-cancelDate)/86400000);
  const sameDay=paidDate&&cancelDate.toDateString()===paidDate.toDateString();

  if(days>=10) return {label:`${days}일 전 (10일 전까지)`,rate:0.10,blocked:false};

  return {label:`${days}일 전 (2일 전~마감일)`,rate:0.30,blocked:false};
}

        <div class="fld"><label for="s4">4. 처리 기간 (행사형은 3영업일 상한)</label><input class="input" id="s4" value="3영업일"></div>
        <div class="fld"><label for="s5">5. 요청 방법</label><input class="input" id="s5" value="앱 › 문의 › 수업 선택 › 환불 요청"></div>
        <div class="fld"><label for="s6">6. 대표 연락처</label><input class="input" id="s6" value="02-000-0000"></div>
        <div class="note">바꾼 공지는 그 뒤에 게시되는 수업부터 들어갑니다. 이미 결제한 회원에게는 결제 때의 공지가 적용됩니다.</div>
        <button class="btn sm ink" onclick="toast('공지를 저장했어요 · 새로 게시되는 수업부터 적용')">저장</button></div></div>
    </div></div>`;
  return webShell("owner",items,o.screen,inner,who);
}

/* ============================== 렌더 ============================== */
function render(){
  const rail=document.getElementById("rail"), canvas=document.getElementById("canvas");
  const r=S.role;
  const list=r==="member"?MEMBER_SCREENS:r==="instructor"?INSTR_SCREENS:OWNER_SCREENS;
  const cur=S[r[0]].screen;
  rail.innerHTML=`<h4>${r==="member"?"회원 앱 · 화면":r==="instructor"?"강사 · 화면":"대표 콘솔 · 화면"}</h4>${list.map(([k,l],i)=>`<button aria-current="${k===cur}" onclick="go('${r}','${k}')"><span class="n">${String(i+1).padStart(2,"0")}</span>${l}</button>`).join("")}
    <div class="meta">요구사항 원본은 spec.md(2026-09-30). 화면의 학원·이름·금액은 예시입니다.<br><br><span class="kbd">←</span> <span class="kbd">→</span> 화면 이동</div>`;
  if(r==="member"){
    const e=EXPLAIN[cur];
    canvas.innerHTML=`<div class="phone-wrap">${memberScreen()}<div class="explain"><span class="chip acc" style="margin-bottom:10px">회원 앱 · ${list.findIndex(x=>x[0]===cur)+1} / ${list.length}</span><h3>${e.t}</h3><p>${e.p}</p>${e.steps.length?`<ul class="steps">${e.steps.map(s=>`<li><span class="k">${s[0]}</span><span><b>${s[1]}</b> — ${s[2]}</span></li>`).join("")}</ul>`:""}<div class="fr">${e.fr.map(f=>`<span>${f}</span>`).join("")}</div></div></div>`;
  } else if(r==="instructor") canvas.innerHTML=instructorScreen();
  else canvas.innerHTML=ownerScreen();
}
document.addEventListener("keydown",e=>{
  if(["INPUT","SELECT","TEXTAREA"].includes(document.activeElement.tagName))return;
  const list=S.role==="member"?MEMBER_SCREENS:S.role==="instructor"?INSTR_SCREENS:OWNER_SCREENS;
  const i=list.findIndex(x=>x[0]===S[S.role[0]].screen);
  if(e.key==="ArrowRight"&&i<list.length-1)go(S.role,list[i+1][0]);
  if(e.key==="ArrowLeft"&&i>0)go(S.role,list[i-1][0]);
});
render();
</script>
