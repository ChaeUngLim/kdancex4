<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-DanceX4 화면 시나리오 보드 (2026-09-30)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
/* ── 디자인 토큰 ─────────────────────────────────────────── */
:root{
  --bg:#F4F1EC; --surface:#FFFFFF; --surface-2:#F8F6F2; --line:#E8E2DA; --line-2:#D9D1C6;
  --ink:#141216; --ink-2:#4E4853; --ink-3:#8B8490;
  --flame:#E4482B; --flame-soft:#FCE9E4; --flame-fg:#FFFFFF;
  --ok:#1E7A4C; --ok-soft:#E1F3E8; --warn:#A8620A; --warn-soft:#FBEFD8; --info:#3452B5; --info-soft:#E6EAFB;
  --night:#17151B; --night-2:#211E26; --night-line:#2E2A35; --night-fg:#F3EFEA; --night-fg-2:#A9A2AF;
  --g-dsp:#B4232B; --g-tango:#C4711B; --g-swing:#D99A1E; --g-salsa:#D63A7C;
  --display:"Geist","Noto Sans KR",system-ui,sans-serif; --body:"Noto Sans KR","Geist",system-ui,sans-serif;
  --r-xl:28px; --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
  --shadow:0 1px 2px rgba(20,18,22,.05),0 12px 32px -16px rgba(20,18,22,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:#EAE6DF;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:var(--display);letter-spacing:-.02em}
p{margin:0}
.board{padding:64px}
.section{margin-bottom:96px}
.section-head{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
.section-head h1{font-size:36px;font-weight:800}
.section-head p{color:var(--ink-2);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:48px 40px;align-items:flex-start}
.frame-wrap{display:flex;flex-direction:column;gap:12px}
.frame-label{font-family:var(--display);font-size:13px;font-weight:600;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.frame-label b{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 8px;border-radius:6px;background:var(--ink);color:#fff;font-size:11px}
.frame-label small{color:var(--ink-3);font-weight:500}

/* ── 폰 프레임 390×844 ───────────────────────────────────── */
.phone{width:390px;height:844px;background:var(--bg);border-radius:0;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.phone.dark{background:var(--night);color:var(--night-fg)}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;font-family:var(--display);font-weight:600;font-size:15px}
.status .icons{display:flex;gap:6px;align-items:center}
.status .sig{width:18px;height:11px;border-radius:2px;background:currentColor;opacity:.9}
.status .bat{width:26px;height:12px;border-radius:4px;border:1.5px solid currentColor;position:relative}
.status .bat::after{content:"";position:absolute;left:2px;top:2px;bottom:2px;width:16px;border-radius:2px;background:currentColor}
.screen{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0 20px}
.topnav{display:flex;align-items:center;gap:12px;height:52px}
.topnav .back{width:36px;height:36px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px}
.topnav h3{font-size:17px;font-weight:700;flex:1}
.topnav .step{font-family:var(--display);font-size:12px;color:var(--ink-3);font-weight:600}
.tabbar{height:84px;border-top:1px solid var(--line);background:var(--surface);display:flex;padding:10px 12px 22px}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);font-weight:500}
.tabbar div i{width:24px;height:24px;border-radius:8px;background:var(--line);display:block}
.tabbar div.on{color:var(--ink);font-weight:700}
.tabbar div.on i{background:var(--ink)}
.tabbar div.ai i{background:linear-gradient(135deg,var(--flame),#F5A25A)}
.h1{font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.03em}
.h2{font-size:20px;font-weight:700;line-height:1.25}
.sub{color:var(--ink-2);font-size:14px;line-height:1.5}
.tiny{font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.02em}
.eyebrow{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--flame)}
.stack{display:flex;flex-direction:column;gap:12px}
.hstack{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.night{background:var(--night);color:var(--night-fg);border-color:var(--night)}
.card.soft{background:var(--surface-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:var(--r-md);font-weight:700;font-size:15px;background:var(--ink);color:#fff}
.btn.flame{background:var(--flame)}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.btn.sm{height:40px;font-size:13px;border-radius:12px;padding:0 14px}
.btn.disabled{background:var(--line);color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:var(--r-pill);border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.flame{background:var(--flame-soft);color:var(--flame);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.info{background:var(--info-soft);color:var(--info)} .tag.flame{background:var(--flame-soft);color:var(--flame)} .tag.ink{background:var(--ink);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.input{height:50px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--surface);padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:15px}
.input .ph{color:var(--ink-3)}
.avatar{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#F2C9B8,#E4482B);flex:none}
.avatar.sq{border-radius:12px}
.divider{height:1px;background:var(--line)}
.seat{display:flex;flex-direction:column;gap:6px}
.seat .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.seat .bar i{display:block;height:100%;background:var(--ink)}
.seat .bar i.full{background:var(--flame)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi span{font-size:12px;color:var(--ink-3);font-weight:500}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.toggle{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.toggle.on{background:var(--ok)} .toggle.on::after{left:21px}
.check{width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex:none}
.check.on{background:var(--flame);border-color:var(--flame)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);flex:none}
.radio.on{border:7px solid var(--ink)}

/* ── 장르 카드 (직사각형 사진 카드) ───────────────────────── */
.gcard{position:relative;height:150px;border-radius:var(--r-lg);overflow:hidden;background:#222;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;border:2px solid transparent}
.gcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gcard .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.72) 100%)}
.gcard .t{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.gcard h4{font-size:18px;font-weight:800;letter-spacing:-.02em}
.gcard p{font-size:12px;opacity:.9;margin-top:2px}
.gcard.on{border-color:var(--flame);box-shadow:0 0 0 3px rgba(228,72,43,.25)}
.gcard.tall{height:236px}
.gsq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gsq .gcard{height:auto;aspect-ratio:1/1;padding:12px 13px}
.gsq .gcard h4{font-size:16px}
.gsq .gcard p{font-size:11px;line-height:1.35}
.gsq .gcard .check{width:20px;height:20px;font-size:12px}
.gsq4 .gcard{height:auto;aspect-ratio:1/1}
.chips.nowrap{flex-wrap:nowrap;overflow:hidden}
.gcard.hero{height:100%;border-radius:0;border:0;padding:0}
.gcard .pill{position:relative;display:inline-flex;height:24px;align-items:center;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.18);font-size:11px;font-weight:700;margin-bottom:8px;width:max-content}

/* ── 순위판 ─────────────────────────────────────────────── */
.rank{display:flex;align-items:center;gap:12px;height:44px}
.rank b{font-family:var(--display);width:22px;font-size:15px;font-weight:800;color:var(--ink-3)}
.rank b.top{color:var(--flame)}
.rank .n{flex:1;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .n small{color:var(--night-fg-2);font-weight:500;margin-left:6px}
.rank .d{font-family:var(--display);font-size:12px;font-weight:700}
.rank .d.up{color:#6FD59A} .rank .d.dn{color:var(--night-fg-2)}

/* ── AI 에이전트 카드 ───────────────────────────────────── */
.bubble{max-width:86%;padding:12px 14px;border-radius:18px;font-size:14px;line-height:1.5}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.agent{border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.agent i{width:34px;height:34px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal}
.agent b{font-size:13px;display:block}
.agent p{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

/* ── 웹 프레임 1280×832 ─────────────────────────────────── */
.web{width:1280px;height:832px;background:var(--bg);display:flex;overflow:hidden;box-shadow:var(--shadow)}
.side{width:236px;background:var(--night);color:var(--night-fg);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.side .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:16px;padding:6px 8px 18px}
.side .brand i{width:28px;height:28px;border-radius:9px;background:var(--flame);display:block}
.side a{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:12px;color:var(--night-fg-2);font-weight:600;font-size:14px}
.side a.on{background:var(--night-2);color:#fff}
.side a i{width:18px;height:18px;border-radius:6px;background:currentColor;opacity:.5}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--night-2)}
.side .who small{display:block;color:var(--night-fg-2);font-size:11px}
.main{flex:1;padding:28px 32px;display:flex;flex-direction:column;gap:20px;overflow:hidden}
.main .head{display:flex;align-items:flex-end;justify-content:space-between}
.main .head h2{font-size:26px;font-weight:800}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:1fr 1fr} .g21{grid-template-columns:2fr 1fr} .g12{grid-template-columns:1fr 2fr}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--ink-3);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.r,th.r{text-align:right}
.poster{border-radius:16px;background:linear-gradient(160deg,#2B1B3D,#E4482B 70%,#F5A25A);height:100%;min-height:520px;position:relative;color:#fff;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.poster .big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1;letter-spacing:-.03em}
.poster .box{position:absolute;border:2px solid #7CF3B4;border-radius:6px;background:rgba(124,243,180,.12)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-family:var(--display);font-size:13px}
.cal div{height:40px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:600;color:var(--ink-2);position:relative}
.cal div.h{color:var(--ink-3);font-size:11px;height:24px}
.cal div.ev::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--flame)}
.cal div.on{background:var(--ink);color:#fff}
.cal div.mute{color:var(--line-2)}
.swatch{display:flex;flex-direction:column;gap:8px;width:120px}
.swatch i{display:block;height:72px;border-radius:16px;border:1px solid rgba(0,0,0,.06)}
.swatch b{font-family:var(--display);font-size:12px}
.swatch span{font-size:11px;color:var(--ink-3);font-family:var(--display)}
.type-row{display:flex;align-items:baseline;gap:18px}
.type-row small{width:110px;color:var(--ink-3);font-family:var(--display);font-size:12px;flex:none}
</style>
</head>
<body>
<div class="board" id="board"></div>
<script>
/* ── 데이터: 장르 4종 (docs/policy/genre-taxonomy-policy.md · FR-020 · FR-021) ── */
const G=[
// 장르 카드 그림(2026-10-02 심야 채택, 캐릭터 태그판): 「천국의 문」 등장인물을 Danbooru 캐릭터 태그로 로컬 Illustrious XL 2.0(RTX 4060, 무료)에서 생성. 댄스스포츠·스윙 = 스파이크 + 페이,
// 탱고 = 비셔스 + 줄리아, 살사/바차타 = 빈센트 + 일렉트라. 원본은 assets/genres/illustrious/, 현재 자리(assets/genres/*.jpg)에 복사해 둠.
// 실제 작품의 캐릭터라 내부 프로토타입 전용 — 배포 앱에는 못 쓴다. 생성: gen_genre_multi.py --style bebop_cast --model local-illustrious --no-label --out-dir assets/genres/illustrious
 {k:"dsp",  name:"댄스스포츠",     desc:"라틴 5종 · 스탠다드 5종. 파트너와 배우는 정통 커플 댄스", img:"assets/genres/dancesport.jpg",    c:"var(--g-dsp)"},
 {k:"tango",name:"아르헨티나 탱고", desc:"밀롱가에서 즉흥으로 이어 가는 안기의 춤",              img:"assets/genres/tango.jpg",         c:"var(--g-tango)"},
 {k:"swing",name:"스윙댄스",       desc:"재즈에 맞춰 뛰노는 린디합·찰스턴",                    img:"assets/genres/swing.jpg",         c:"var(--g-swing)"},
 {k:"salsa",name:"살사/바차타",    desc:"라틴 클럽의 밤을 채우는 두 리듬",                     img:"assets/genres/salsa_bachata.jpg", c:"var(--g-salsa)"},
];

/* ── 공용 조각 ── */
const status=()=>`<div class="status"><span>9:41</span><span class="icons"><i class="sig"></i><i class="bat"></i></span></div>`;
const tabbar=(on)=>`<div class="tabbar">${["홈","검색","AI 플래너","캘린더","마이"].map(t=>`<div class="${t===on?"on":""} ${t==="AI 플래너"?"ai":""}"><i></i>${t}</div>`).join("")}</div>`;
const topnav=(t,step)=>`<div class="topnav"><div class="back">‹</div><h3>${t}</h3>${step?`<span class="step">${step}</span>`:""}</div>`;
const phone=(inner,opt={})=>`<div class="phone ${opt.dark?"dark":""}">${status()}<div class="screen">${inner}</div>${opt.tab?tabbar(opt.tab):""}</div>`;
const frame=(no,title,note,inner)=>`<div class="frame-wrap"><div class="frame-label"><b>${no}</b>${title}${note?`<small>· ${note}</small>`:""}</div>${inner}</div>`;
const gcard=(g,on,extra="")=>`<div class="gcard ${on?"on":""} ${extra}"><img src="${g.img}" alt=""><div class="ov"></div><div class="t"><div><h4>${g.name}</h4><p>${g.desc}</p></div><span class="check ${on?"on":""}">${on?"✓":""}</span></div></div>`;
const seat=(label,m,mt,f,ft)=>`<div class="seat"><div class="between"><span class="tiny">${label}</span><span class="tiny num">남 ${m}/${mt} · 여 ${f}/${ft}</span></div><div class="bar"><i style="width:${(m/(mt+ft))*100}%"></i><i class="${f===ft?"full":""}" style="width:${(f/(mt+ft))*100}%;margin-left:2px"></i></div></div>`;
const rank=(i,n,a,d,cls)=>`<div class="rank"><b class="${i<=3?"top":""}">${i}</b><span class="n">${n}<small>${a}</small></span><span class="d ${cls}">${d}</span></div>`;
const classCard=(o)=>`<div class="card"><div class="hstack" style="align-items:flex-start"><div class="avatar sq" style="background:${o.c}"></div><div class="grow"><div class="between"><b style="font-size:15px">${o.name}</b>${o.tag||""}</div><div class="tiny" style="margin-top:2px">${o.academy} · ${o.time}</div></div></div><div style="margin-top:12px">${seat("정원",o.m,o.mt,o.f,o.ft)}</div><div class="between" style="margin-top:12px"><span class="num" style="font-weight:800;font-size:16px">${o.price}<span class="tiny" style="font-weight:600">/월</span></span><span class="tiny">${o.why}</span></div></div>`;

/* ── 회원 앱 화면 ── */
const M={};
M.login=phone(`<div class="gcard hero" style="margin:0 -20px;flex:1"><img src="assets/genres/salsa_bachata.jpg" alt=""><div class="ov" style="background:linear-gradient(180deg,rgba(23,21,27,.05) 20%,rgba(23,21,27,.92) 70%)"></div>
 <div class="t" style="position:absolute;left:24px;right:24px;bottom:28px;display:block">
  <div class="pill">소셜댄스 결제 · 멀티 AI 플래너</div>
  <h1 class="h1" style="font-size:38px;color:#fff">오늘 밤,<br>어떤 춤을 출까요?</h1>
  <p style="color:rgba(255,255,255,.8);margin:12px 0 22px;font-size:14px">장르를 고르면 강남·홍대·잠실의 수업과 파티를 AI 가 대신 찾아 줍니다.</p>
  <div class="stack">
   <div class="btn" style="background:#FEE500;color:#191600">카카오로 시작하기</div>
   <div class="btn" style="background:#fff;color:#111">Google 로 시작하기</div>
   <div class="btn" style="background:#03C75A;color:#fff">네이버로 시작하기</div>
  </div>
  <p class="tiny" style="color:rgba(255,255,255,.55);text-align:center;margin-top:14px">가입 뒤에만 이용할 수 있어요 · 만 14세 미만은 보호자 계정에서 자녀로 등록</p>
 </div></div>`,{dark:true});

M.verify=phone(`${topnav("휴대폰 본인확인","1 / 4")}
