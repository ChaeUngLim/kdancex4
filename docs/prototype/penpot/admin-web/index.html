<main><figure id="W1a"><a href="W1a.png" target="_blank"><img src="W1a.png" loading="lazy" alt="W1a 로그인"></a><figcaption><b>W1a</b> 로그인<span>아이디·비밀번호. 로그인도 콘솔도 하나다. 운영자 안내는 적지 않는다</span><em>FR-300</em></figcaption></figure><figure id="W1b"><a href="W1b.png" target="_blank"><img src="W1b.png" loading="lazy" alt="W1b 2단계 인증 (인증 앱 OTP)"></a><figcaption><b>W1b</b> 2단계 인증 (인증 앱 OTP)<span>관리 웹에 들어오는 모든 계정 공통, 같은 기기 30일 기억</span><em>FR-303</em></figcaption></figure><figure id="W1c"><a href="W1c.png" target="_blank"><img src="W1c.png" loading="lazy" alt="W1c 권한에 따라 보이는 메뉴"></a><figcaption><b>W1c</b> 권한에 따라 보이는 메뉴<span>대표는 전체, 권한 받은 강사는 위임받은 메뉴만, 운영자는 「플랫폼 정산」 추가. 들어갈 곳 고르기 화면은 2026-11-10 폐기</span><em>FR-300 · FR-081a</em></figcaption></figure><figure id="W2a"><a href="W2a.png" target="_blank"><img src="W2a.png" loading="lazy" alt="W2a 입점 신청"></a><figcaption><b>W2a</b> 입점 신청<span>등록 형태 4종·증빙·업종코드·입점 조건 동의 5항목</span><em>FR-085 · FR-125b · FR-251</em></figcaption></figure><figure id="W2b"><a href="W2b.png" target="_blank"><img src="W2b.png" loading="lazy" alt="W2b 입점 · 설정"></a><figcaption><b>W2b</b> 입점 · 설정<span>약관 변경 통지·학원 정보·등록 형태·정산 계좌·동의 기록</span><em>FR-070 · FR-139 · FR-259</em></figcaption></figure><figure id="W3a"><a href="W3a.png" target="_blank"><img src="W3a.png" loading="lazy" alt="W3a 강사 관리"></a><figcaption><b>W3a</b> 강사 관리<span>소속 신청 승인·초대 링크·위임 권한 3종. 권한을 켠 강사는 관리 웹에서 그 메뉴만 쓴다</span><em>FR-011 · FR-071 · FR-081a</em></figcaption></figure><figure id="W3b"><a href="W3b.png" target="_blank"><img src="W3b.png" loading="lazy" alt="W3b 강사 소속 해제"></a><figcaption><b>W3b</b> 강사 소속 해제<span>남은 회차를 대체·휴강·폐강으로 먼저 처리</span><em>FR-082</em></figcaption></figure><figure id="W3c"><a href="W3c.png" target="_blank"><img src="W3c.png" loading="lazy" alt="W3c 강의실 배정"></a><figcaption><b>W3c</b> 강의실 배정<span>주간표·다른 학원 일정은 불가 시간·겹침 경고</span><em>FR-072 · FR-083</em></figcaption></figure><figure id="W4a"><a href="W4a.png" target="_blank"><img src="W4a.png" loading="lazy" alt="W4a 환불·취소 공지 · 정규 과정"></a><figcaption><b>W4a</b> 환불·취소 공지 · 정규 과정<span>등록 형태별 템플릿 자동, 더 돌려주는 쪽으로만 수정, 회원에게 보이는 미리보기</span><em>FR-086 · FR-099 · FR-099a</em></figcaption></figure><figure id="W4b"><a href="W4b.png" target="_blank"><img src="W4b.png" loading="lazy" alt="W4b 환불·취소 공지 · 이벤트형"></a><figcaption><b>W4b</b> 환불·취소 공지 · 이벤트형<span>취소 수수료 표(낮추기만)·처리 기간 3영업일 상한·환불 마감일</span><em>FR-099c · FR-099d</em></figcaption></figure><figure id="W5"><a href="W5.png" target="_blank"><img src="W5.png" loading="lazy" alt="W5 학원 공지"></a><figcaption><b>W5</b> 학원 공지<span>소속 강사 전용, 글로만 작성, 회원에게는 안 보임</span><em>FR-063a · FR-078</em></figcaption></figure><figure id="W6"><a href="W6.png" target="_blank"><img src="W6.png" loading="lazy" alt="W6 예약 · 명단"></a><figcaption><b>W6</b> 예약 · 명단<span>현장 등록 남·여 따로 − n +, 회원 수강·예약·출석·문의</span><em>FR-079 · FR-106</em></figcaption></figure><figure id="W7a"><a href="W7a.png" target="_blank"><img src="W7a.png" loading="lazy" alt="W7a 1+1 쿠폰 참여 · 효과 리포트"></a><figcaption><b>W7a</b> 1+1 쿠폰 참여 · 효과 리포트<span>참여 선택, 노출·누름·순위·쿠폰 사용 수, 우리 학원 숫자만</span><em>FR-121c · FR-121i</em></figcaption></figure><figure id="W7b"><a href="W7b.png" target="_blank"><img src="W7b.png" loading="lazy" alt="W7b 강사별 매출"></a><figcaption><b>W7b</b> 강사별 매출<span>강사·수업별 결제 건수와 매출, 보류·정산 완료 예정·정산 완료 구분</span><em>FR-126 · FR-130 · FR-135</em></figcaption></figure></main></body></html>
